name: Qodo Review

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    # Triggers ONLY when:
    # 1. DeepSource completes its review — Qodo runs after and summarizes logical issues
    # 2. Explicit /review comment — manual trigger
    if: |
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'deepsource-io[bot]') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    name: Run Qodo on PR
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
