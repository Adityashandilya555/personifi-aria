## PHASE-BY-PHASE CONTEXT

### Phase 0 — Database Foundation (#127, #128) [Dev4] [S: 1-2 days]
Entry: PostgreSQL access + Bedrock credentials ready
What is being built:
  - proactive_state table: Sentinel writes, Alpha reads. Indexes: user_id + status composite
  - stimulus_cache table: TTL-based stimulus data. Constraint: user_id + stimulus_key unique
  - tool_results table: pre-fetched tool call results
  - pulse_history table: score + state + delta audit trail
  - signal_packets table: Alpha → Sentinel signal bridge
  - Ollama client (src/ollama-client.ts): health check + fallback, structured JSON output
Checkpoint tests:
  - INSERT INTO proactive_state + SELECT round-trip
  - Ollama responds to scoring prompt with valid JSON
  - Existing bot still responds to "hello"
  - Telegram message hits webhook → user record exists in DB → message stored in sessions table

### Phase 1 — Fusion Engine + Soul Files (#119, #120) [Dev1] [M: 3-5 days]
Entry: Phase 0 complete (all 5 tables exist)
What is being built:
  - src/fusion-engine.ts with two modes:
    Reactive: Check proactive_state → merge context → route decision (execute_tool / inject_prefetch / respond)
    Proactive: Read Sentinel scores → apply thresholds: ≥0.8 FIRE, 0.6-0.8 BUFFER, <0.6 DROP
  - Scoring formula: score = Σ stimulus_w × pref_match(U,S) × receptivity(U) × (1-fatigue(U))
  - Mode switching thresholds:
    PROACTIVE (80+): aggressive 0.8 threshold
    ENGAGED (50-79): balanced
    CURIOUS (25-49): cautious 0.85 threshold
    PASSIVE (0-24): minimal 0.9 threshold
  - config/soul.md (~500 tokens): core identity, tone rules, social awareness, response style
  - config/sentinel-soul.md (~300 tokens): scoring rules, fire thresholds, fatigue logic
  - Fusion wired as PARALLEL ADDITION to handler.ts — NOT replacing gates yet
Checkpoint tests:
  - fusionEngine.reactiveDecision() returns correct routing for no-tool, tool-call, pre-fetched messages
  - fusionEngine.proactiveDecision() returns FIRE/BUFFER/DROP correctly on threshold values
  - soul.md produces coherent responses as system prompt with Groq 70B
  - Existing 22-step pipeline still works (Fusion is additive only)
  - Send message → log Fusion decision → compare to old gate decisions

### Phase 2A — Alpha Rewrite / Reactive Pipeline (#124, #126, #129, #131, #134) [Dev3 lead, Dev4] [XL: 7-10 days]
Entry: Phase 1 complete
What is being built (in order):
  1. src/tool-definitions.ts — Groq-compatible function schemas for 8 tools: cab_compare, place_search, weather_check, event_lookup, price_alert, food_finder, friend_activity, set_reminder
  2. src/tool-executor.ts — maps function names → existing hook-registry
  3. src/tool-sandbox.ts — pre-execution validation, rate limiting per tool per user, malformed JSON repair → retry once → fail gracefully, phantom tool call rejection
  4. Context window budget enforcer: soul.md ~500 + context ~1000 + ProactiveState ~300 + Pulse ~200 + history ~1500 = 3500 fixed, 4500 remaining for tool results
  5. Groq function calling in Alpha: replace 2-step (8B classify → Scout execute) with single Alpha call with function definitions
  6. New handler.ts — 5 steps only:
     Step 1 RECEIVE: parse webhook, extract message/userId/chatId
     Step 2 GATHER: parallel context (~50ms) — Qdrant + Neo4j + PostgreSQL prefs + ProactiveState + Pulse + Topics
     Step 3 LLM CALL 1: Alpha with soul.md + context bundle + function definitions
     Step 4 TOOL?: if tool_call → sandbox → execute → Alpha call 2 with result
     Step 5 RESPOND + fire-and-forget writes: Pulse update, topic intent, memory queue, pref signals, session update, social signals
  - handler-legacy.ts MUST be preserved with feature flag for instant rollback
Checkpoint tests:
  - Simple message "hey what's up": 1 LLM call, <300ms
  - Tool call "compare cab prices to Koramangala": 2 LLM calls, <500ms
  - Tool sandbox catches malformed JSON and recovers
  - Context window within budget with large tool results
  - Feature flag switches between old and new handler instantly
  - 10 message types via Telegram all reach new handler (text, location, voice, button callback, /command)
  - Fire-and-forget writes: pulse_update + signal_packet + memory_queue appear in DB within 2 seconds of response
  - Manually insert proactive_state row → send related message → Alpha incorporates it

### Phase 2B — Provider Migrations + Concurrency (#140, #141, #139) [Dev4, Dev1] [L: 5-7 days] — PARALLEL with 2A
Entry: Phase 0 complete
What is being built:
  - src/providers/alpha-provider.ts: Together AI + Fireworks + Groq adapters, failover Together → Fireworks → Groq
  - src/providers/sentinel-provider.ts: Bedrock (real-time) + Together Batch (bulk scoring) + Ollama (local dev), failover Bedrock → Together → Ollama
  - Per-user message queue: same user = sequential processing, different users = parallel
  - Rate limiting: Together 600 rpm, Bedrock auto-scales
  - Queue overflow handling with backpressure
  - Per-user lock to prevent concurrent context write corruption
Checkpoint tests:
  - Alpha via Together AI with function calling working
  - Failover: kill Together → Fireworks handles → restore Together → traffic returns
  - Sentinel scores 100 users in <30 seconds via Bedrock
  - 50 simultaneous users all get responses within 3 seconds
  - Same user 3 rapid messages → processed in order

