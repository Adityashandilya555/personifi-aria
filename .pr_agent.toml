### Phase 4 — Sentinel + Proactive Intelligence (#121, #122) [Dev2] [L: 5-8 days]
Entry: Phase 1 (Fusion), Phase 2B (Sentinel provider), Phase 0 (tables)
What is being built:
  1. Single event-driven Sentinel loop replacing ALL 12 cron jobs:
     - Stimulus Refresh (weather/traffic/events) — was */30m × 3 crons
     - Social Monitor (friend graph changes) — was */15m + */30m crons
     - Topic Followup (stale intents) — was */30m cron
     - Content Scan (trending + relevant) — was */2h + */6h crons
     - Memory Process (queued writes) — was */30s cron
     - Session Cleanup (summarize + trim) — was */5m cron
     Per-user pipeline: Collect Stimuli → Score Each → Social Overlay → Decide (FIRE/BUFFER/DROP)
     FIRE: write ProactiveState + trigger Alpha delivery via Telegram API
     BUFFER: write ProactiveState only (Alpha picks up on next user message)
     PRE-FETCH: call tool API → cache in tool_results → then FIRE/BUFFER
     DROP: log for analytics, discard
     Fatigue: max 3 proactive msgs/user/day (5 if PROACTIVE pulse), 8am-10pm IST window
     sentinel-soul.md as scoring personality
  2. Pulse FSM mode switching:
     score ≥ 50 → PROACTIVE mode, < 50 → REACTIVE mode
     PROACTIVE → REACTIVE: Sentinel stops FIRing, only BUFFERs
     REACTIVE → PROACTIVE: requires 3 positive interactions, then softer threshold (0.85)
     Sentinel alert on ENGAGED → CURIOUS drop (re-scan for indoor/comfort stimuli)
     Pulse signals: rejection = -18, committed = +14, soft-yes = +8, ignore = -5
     Hysteresis: ±5 buffer on boundaries to prevent oscillation
     pulse_history written on every state change
  Sub-issue: #146 Sentinel stimulus source integration test, #149 Pulse recovery protocol counter
Checkpoint tests:
  - 100 users processed in <60 seconds (Bedrock batch scoring)
  - Rain + commute at 8:45 → score ≥ 0.8 → FIRE
  - Concert in genre user dislikes → score < 0.6 → DROP
  - FIRE → ProactiveState → Alpha delivery → user receives Telegram message
  - BUFFER → user sends message → Alpha injects buffered context → response reflects it
  - After 3 proactive msgs in one day, 4th at 0.82 → DROP (fatigue)
  - User rejects twice → Pulse drops → mode switches REACTIVE → Sentinel stops FIRing

