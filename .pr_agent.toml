Reference the relevant phase (Phase 0 through Phase 7) and issue number(s) from the Personifi-Aria implementation plan if this PR is part of the migration. Use these labels where applicable: phase-0-db, phase-1-fusion, phase-2a-handler, phase-2b-providers, phase-3-ux, phase-4-sentinel, phase-5-features, phase-6-cleanup, phase-7-testing.
State clearly if this PR is a parallel addition (safe to merge without replacing existing logic) or a replacement (requires the previous phase checkpoint to be verified first).
"""

[pr_code_suggestions]
num_code_suggestions = 4
summarize = true
extra_instructions = """
Prioritize suggestions that:
1. Reduce LLM calls per message toward 1-2 max
2. Move any DB writes that happen after the response into fire-and-forget (non-blocking)
3. Push handler.ts toward the 5-step pattern: RECEIVE → GATHER → LLM1 → TOOL? → RESPOND+WRITE
4. Strengthen Telegram data pipeline (webhook parsing, sendData() validation, parse mode HTML consistency)
5. Route new periodic/background work through the Sentinel loop instead of new cron jobs
6. Ensure tool calls go through tool-sandbox.ts before execution

Do NOT suggest fixes or improvements to:
mood-engine.ts, influence-engine.ts, cognitive.ts, src/scout/, 8-layer sections of personality.ts, proactiveRunner.ts, or cron jobs in scheduler.ts — all scheduled for deletion in Phase 6.
"""

