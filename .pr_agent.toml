## PROJECT: PERSONIFI-ARIA MIGRATION PLAN

### Current State (being torn down)
- 22-step message handler in handler.ts (1,611 lines)
- 8-layer personality composition in personality.ts
- 12 independent cron jobs in scheduler.ts
- 18 discovery tools with Scout reflection layer (5 files in src/scout/)
- Separate 8B classifier for tool routing in cognitive.ts
- Stack: Groq (8B + 70B), PostgreSQL, Redis, DynamoDB, pgvector
- Pain: 3+ LLM calls per message (~800ms), serial processing, 2000+ token system prompt, 5 scattered decision gates

### Target State (being built)
- Alpha (Model 1): Together/Groq 70B, 1-2 calls per message, ~500 token soul.md, native function calling
- Sentinel (Model 2): Bedrock/Together Batch, single unified background loop
- Fusion Engine (fusion-engine.ts): central routing, reactive mode + proactive mode, replaces 5 handler gates
- Pulse FSM: PASSIVE / CURIOUS / ENGAGED / PROACTIVE states
- Target metrics: 22 steps → 5 steps, 3+ calls → 1-2, ~800ms → ~300ms, 2000+ tokens → ~500 tokens

### Files Scheduled for DELETION — never suggest improving these
- src/character/mood-engine.ts (→ replaced by Pulse FSM)
- src/influence-engine.ts (→ replaced by direct Pulse read)
- src/cognitive.ts (→ replaced by Alpha function calling)
- src/scout/ (5 files) (→ replaced by Alpha function calling)
- personality layers in src/personality.ts (→ replaced by soul.md)
- src/media/proactiveRunner.ts (→ replaced by Sentinel + Fusion)
- scheduler.ts 12 cron jobs (→ absorbed into Sentinel loop)

