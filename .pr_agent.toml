## LOGICAL ISSUES TO ACTIVELY CHECK (your exclusive focus)

Only flag issues in these categories — ignore everything else:

MUST FIX — logical correctness:
- Pulse delta values that don't match spec: rejection=-18, committed=+14, soft-yes=+8, ignore=-5
- Scoring formula deviations: score = Σ stimulus_w × pref_match(U,S) × receptivity(U) × (1-fatigue(U))
- Wrong FIRE/BUFFER/DROP thresholds: FIRE ≥0.8, BUFFER 0.6-0.8, DROP <0.6
- Blocking DB writes in the response path (must be fire-and-forget after response sent)
- Tool calls that bypass tool-sandbox.ts validation
- ProactiveState injected without checking direction-mismatch against current user intent
- signal_packets not written after each reactive Alpha response
- New periodic work added to scheduler.ts instead of Sentinel loop
- handler-legacy.ts deleted before Phase 6 three-day burn-in
- Missing unique constraint enforcement (user_id+stimulus_key on proactive_state)
- Sentinel FIRE path that skips writing to proactive_state before calling Telegram API
- Fatigue logic that allows more than 3 proactive messages/day (5 if PROACTIVE pulse)
- Pulse mode switch without hysteresis (must require 3 positive interactions for REACTIVE→PROACTIVE recovery)

DO NOT FLAG (DeepSource already handles these):
- Code style, formatting, naming conventions
- Missing type annotations
- Import ordering
- Unused variables or dead code
- Test coverage
- Complexity metrics
- Any issue in files scheduled for deletion: mood-engine.ts, influence-engine.ts, cognitive.ts, src/scout/, personality.ts legacy layers, proactiveRunner.ts
